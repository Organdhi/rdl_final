        <h1>イリオモテヤマネコとは</h1>
        <img src="./mayaneko_1.jpg" alt="イリオモテヤマネコ" width=50%>
        <p>生息地：日本（沖縄県西表島）</p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d116319.95012640228!2d123.71861475101822!3d24.346546947757094!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34607df99304a619%3A0x76d7bc48d8360f86!2z6KW_6KGo5bO2!5e0!3m2!1sja!2sjp!4v1783866410271!5m2!1sja!2sjp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <p>大きさ：頭胴長 50から60センチメートル（尾長 23から24センチメートル）</p>

        <p>絶滅しそうな理由：交通事故（ロードキル）、土地開発による生息地の改変、イエネコからの感染症</p>
        <p>対策：飛び出し防止看板の設置、移動用アンダーパス（動物専用トンネル）の整備、外来種や飼い猫の管理</p>
